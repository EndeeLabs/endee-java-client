# SLF4J SimpleLogger config for test runs only. This file lives under src/test/resources,
# so it is never packaged into the published jar (which only contains src/main/java's output).
#
# io.endee.client.Endee logs every non-2xx response at ERROR level unconditionally,
# even when the caller immediately catches the resulting exception (e.g. a test
# asserting a 404 maps to NotFoundException). That made passing tests print
# scary-looking ERROR lines for expected, handled behavior. Genuine unexpected
# failures are unaffected: JUnit/Surefire report those independently of SLF4J,
# with the full exception and stack trace, in the console and in
# target/surefire-reports/.
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.log.io.endee.client=off
